name: Weekly Reddit scrape and game list refresh

on:
  schedule:
    # 09:00 UTC every Tuesday = 1am PST (standard time). During PDT (daylight
    # saving, roughly mid-March to early November) this runs at 2am PDT instead,
    # since GitHub Actions cron always runs in UTC and cannot shift with DST.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Wikidata game list
        continue-on-error: true # Wikidata's SPARQL endpoint is flaky under this query's
        # load (502/504/429s) - this failing shouldn't block the actually-important step
        # below, which just uses whatever data/games.json is already committed instead.
        run: python scripts/fetch_games.py

      - name: Supplement game list with SteamSpy catalog
        continue-on-error: true # same reasoning as the Wikidata step above
        run: python scripts/fetch_steamspy_games.py

      - name: Scrape Reddit for new "Solved" posts
        env:
          # GitHub-hosted runners hard-kill the whole job at 6h with no way to
          # raise that (confirmed, not configurable) - and a job-level kill
          # cancels every step at once, including the commit step below, so a
          # run that hits it loses everything, not just its unfinished tail
          # (confirmed: happened for real, discarded ~5h40m of scraping).
          # 320 min leaves ~40 min of the 360 for setup + the refresh steps
          # above + the commit step below, based on this repo's own observed
          # timing for those (~23 min combined on a normal run).
          SCRAPE_TIME_BUDGET_SECONDS: "19200"
        run: python scripts/scrape_reddit.py

      - name: Commit updated data
        run: |
          git config user.name "eagpb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/questions.json data/games.json data/checked_posts.json
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "Weekly data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
