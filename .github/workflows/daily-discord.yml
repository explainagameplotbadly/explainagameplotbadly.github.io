name: Daily Discord announcement

on:
  schedule:
    # 09:05 UTC daily = shortly after 1am PST (standard time). During PDT
    # (daylight saving) this fires at ~2:05am PDT instead - still after that
    # day's rotation either way, since cron always runs in UTC and can't
    # shift with DST (see scrape.yml for the same caveat on the weekly job).
    - cron: "5 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post today's questions to Discord, reveal yesterday's answers
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/daily_discord.py

      - name: Commit updated thread mapping
        run: |
          git config user.name "eagpb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/discord_threads.json
          if git diff --cached --quiet; then
            echo "No thread-mapping changes, skipping commit."
          else
            git commit -m "Update Discord thread mapping: $(date -u +%Y-%m-%d)"
            git push
          fi
